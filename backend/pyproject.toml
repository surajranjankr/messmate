[project]
name = "messmate-backend"
version = "0.2.0"
description = "MessMate Backend: FastAPI, SQLAlchemy, SQLite, Pydantic v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "alembic>=1.20.1",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.33",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
